spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skovio_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:noreply@skovio.local}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    cooldown-seconds: ${OTP_COOLDOWN_SECONDS:60}